<style>
:root{--bg:#f2f3f8;--card:#fff;--ink:#181d36;--mut:#5d6384;--line:#d9dcea;--acc:#4a3fb0;--acc2:#e9e7fa;--hi:#f2a900;--ok:#146c43;--okb:#dff3e7;--no:#b42318;--nob:#fbe6e3;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#11142a;--card:#1a1f3d;--ink:#e9ebf8;--mut:#a0a6cc;--line:#2d3463;--acc:#a79dff;--acc2:#262b57;--ok:#6fd49a;--okb:#14301f;--no:#f48b82;--nob:#3a1d1b;color-scheme:dark}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Bricolage Grotesque",system-ui,sans-serif}
button,input{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.shell{display:grid;grid-template-columns:240px 1fr;max-width:1100px;margin:0 auto;min-height:100vh}
aside{padding:20px 14px;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow:auto;align-self:start}
aside h1{font-size:22px;margin:0;font-weight:800;cursor:pointer;line-height:1.1}aside .sub{font-size:13px;color:var(--mut);margin:2px 0 14px}
.wk{display:block;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:8px;padding:7px 10px;margin-bottom:3px}
.wk b{display:block}.wk span{font-size:12.5px;color:var(--mut)}.wk.on{background:var(--acc)}.wk.on b,.wk.on span{color:#fff}.wk.off{opacity:.55}
.info{font-size:13px;color:var(--mut);border-top:1px solid var(--line);margin-top:12px;padding-top:10px}
main{padding:22px 26px 70px;min-width:0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;margin-bottom:18px}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:9px 13px;font-weight:600;color:var(--mut);white-space:nowrap}.tabs button.on{color:var(--ink);border-color:var(--hi)}
h2{font-size:28px;margin:0 0 4px;font-weight:800;line-height:1.1}h3{font-size:18px;margin:16px 0 6px}.lead{color:var(--mut);margin:0 0 16px}
.read{font-family:"Source Serif 4",Georgia,serif;font-size:17.5px;line-height:1.7;max-width:68ch}.read p{margin:.5em 0}.read ul{padding-left:1.2em}
.sec,.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 18px 16px;margin-bottom:12px}
.card{padding:14px 16px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.cd b{font-size:26px}.cd{font-size:14px;color:var(--mut)}code,.fm{font-family:ui-monospace,Menlo,monospace;font-size:14.5px}.fm{display:block;margin-top:4px}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:99px;background:var(--acc2);color:var(--acc)}
.btn{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-weight:600}.btn.g{background:var(--acc2);color:var(--acc)}.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--hi);transition:width .4s}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:9px;padding:10px 12px;margin:6px 0}.opt.sel{border-color:var(--acc);background:var(--acc2)}.opt.ok{border-color:var(--ok);background:var(--okb)}.opt.no{border-color:var(--no);background:var(--nob)}
.fb{padding:10px 12px;border-radius:9px;margin:10px 0}.fb.ok{background:var(--okb)}.fb.no{background:var(--nob)}
input[type=text],input[type=search]{border:1.5px solid var(--line);background:var(--card);border-radius:8px;padding:9px 11px;width:140px}input[type=search]{width:100%;max-width:420px}
.nums{display:flex;gap:5px;flex-wrap:wrap}.nums button{width:34px;height:34px;border-radius:8px;border:1.5px solid var(--line);background:var(--card)}.nums .a{background:var(--acc2);border-color:var(--acc)}.nums .c{outline:2px solid var(--hi)}
.hero{position:relative;overflow:hidden;border-radius:12px;background:var(--acc);color:#fff;padding:22px 20px;margin-bottom:16px}.hero svg{position:absolute;right:0;bottom:0;height:100%;opacity:.35}.hero h2,.hero p{position:relative}
.fade{animation:f .25s ease}@keyframes f{from{opacity:0}to{opacity:1}}
@media(max-width:760px){.shell{display:block}aside{position:static;height:auto;border:0;border-bottom:1px solid var(--line)}#wks{display:flex;gap:6px;overflow-x:auto}.wk{min-width:112px}.info{display:none}main{padding:16px 14px 60px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

   hw item: {c,note,intro,parts:[{t,opts:[{x,w}],a:index,e}]} (w = why this option is wrong). Set EXAMS dates as "2026-12-15T09:00" (local time) with dur in minutes. */
const EXAMS=[{name:"Midterm",date:null,dur:null,weight:"40% of final grade",fmt:"Mock 2022: one part per topic; select-all and matching questions"},{name:"Final",date:null,dur:null,weight:"60% of final grade (resit: 100%)",fmt:"Format not provided"}];
const WEEKS=[
{n:1,title:"PCA & reliability",chapters:"Field ch. 18 · Lectures 1a, 1b",
summary:[{h:"Why PCA",p:["PCA reduces many variables to fewer components that act as summaries. It prepares “messy” data (too many variables, unknown structure) before hypothesis testing. Components are latent: not measured, and uncorrelated.","Use it for abstract, multidimensional concepts (e.g. personality, employee satisfaction), mostly questionnaires."]},
{h:"Procedure and data checks",p:["I. Initial checks → II. extraction and rotation → III. new variables.","Data: quantitative variables, many correlations above |.30|, large sample (n = 100 poor, 300 good, 500 very good, 1000+ excellent; or at least 10 × number of items).","KMO should be between 0.5 and 1.0. Bartlett’s test: H0 is that the correlation matrix is an identity matrix, so we want a low p-value."]},
{h:"Extraction",p:["Criteria: B1 cumulative variance explained (often at least 60%), B2 Kaiser (eigenvalue above 1), B3 Cattell scree plot (stop before the elbow). Example from the slides: eigenvalues 1.3, 1.2, 1.1, 0.9, 0.3, 0.2, 0.1 give 3 components by Kaiser, but Cattell suggests 4.","Communality = share of a variable’s variance explained by the components (sum of squared loadings), from 0 to 1. Eigenvalues add up to the number of variables."]},
{h:"Rotation and new variables",p:["Rotation makes loadings more extreme so items fit one component. Orthogonal (varimax) keeps components uncorrelated; oblique lets them correlate. Hide loadings below about .40.","Summated scale: sum or average of a component’s items (average is easier to interpret). Reverse-scored items first: new = (scale + 1) − old, e.g. 6 − x on a 5-point scale. Factor scores come directly from PCA but are harder to interpret.","Reliability: Cronbach’s alpha around .7–.8 is reliable. Drop items with corrected item-total correlation below about .3."]}],
formulas:[{t:"Reverse-scoring",f:"new = (scale + 1) − old",g:0},{t:"Minimum sample",f:"n ≥ 10 × number of items",g:0},{t:"Communality",f:"h² = sum of squared loadings of a variable",g:0},{t:"Component",f:"C₁ = b₁V₁ + b₂V₂ + … + bₙVₙ",g:0}],
terms:[["PCA","Technique that transforms many variables into fewer uncorrelated components."],["Latent variable","Concept that is not measured directly."],["Eigenvalue","How much variance a component explains."],["Communality","Proportion of a variable’s variance shared with the other variables, 0 to 1."],["KMO","Sampling adequacy; want 0.5 to 1.0."],["Bartlett’s test","Tests whether the correlation matrix is an identity matrix."],["Varimax","Orthogonal rotation maximising loadings within components."],["Scree plot","Eigenvalues plotted; retain components before the elbow."],["Cronbach’s alpha","Reliability of a scale."]],
q:[{c:"PCA",t:"mc",q:"Which KMO value supports running a PCA?",o:["0.12","0.35","0.85","−0.60"],a:2,e:"KMO should lie between 0.5 and 1.0; values near 1 mean a compact pattern of correlations."},
{c:"PCA",t:"mc",q:"What do you want from Bartlett’s test of sphericity?",o:["A high p-value","A low p-value","p exactly 1","A KMO of 0"],a:1,e:"H0 says the matrix is an identity matrix (no correlations). A low p rejects it, so the variables are correlated."},
{c:"PCA",t:"num",q:"A 5-point item scores 2. What is the reverse-scored value?",a:4,tol:0,u:"",e:"(5 + 1) − 2 = 4."},{"c":"Mock 2022","t":"multi","q":"What are reasons for using PCA?","o":["We have received data from somewhere and we don’t know their “structure”","We want to study ‘abstract’ constructs and we currently don’t know which items belong together or should be separated","We want to see which underlying constructs/factors can be found","We have far too many variables in our dataset"],"a":[0,1,2,3],"e":"All four fit the lecture: messy data without known structure, abstract constructs, finding underlying factors, and too many variables."},{"c":"Mock 2022","t":"match","q":"Match the ‘initial checks’ for PCA with their description.","m":["This value should be 10–15 times larger than the number of items","“Many” of the values here should be higher than |0.3|","This value should be large, between 0.5 and 1.0","We need to reject the null hypothesis of this check"],"o":["Components","Kaiser-Meyer-Olkin","Components loading","Bartlett’s test","Sample size","Correlation matrix"],"a":[4,5,1,3],"e":"Sample size (10–15 × items), correlation matrix (many above |.30|), KMO (0.5–1.0), Bartlett’s test (reject H0 of an identity matrix)."},{"c":"Scales","t":"num","q":"Component 2 = average of items q5–q8. A respondent scored 4, 5, 3 and 4. What is the component score?","a":4,"tol":0,"u":"","e":"(4 + 5 + 3 + 4) / 4 = 4."}],
quiz:[{c:"PCA",t:"num",q:"Eigenvalues are 1.3, 1.2, 1.1, 0.9, 0.3, 0.2, 0.1. How many components does the Kaiser criterion retain?",a:3,tol:0,u:"",e:"Three eigenvalues are above 1."},
{c:"PCA",t:"num",q:"A variable loads .60 on component 1 and .50 on component 2 (orthogonal). What is its communality?",a:0.61,tol:0.005,u:"",e:".60² + .50² = .36 + .25 = .61."},
{c:"PCA",t:"mc",q:"Which rotation keeps components uncorrelated?",o:["Oblique","Varimax","Promax","Direct oblimin"],a:1,e:"Varimax is orthogonal. The others are oblique."},
{c:"Reliability",t:"num",q:"20 items. What is the minimum sample under the 10 × items rule?",a:200,tol:0,u:"respondents",e:"10 × 20 = 200."},{"c":"PCA","t":"multi","q":"Which are data requirements for PCA?","o":["Quantitative variables","Many correlations above |.30|","A large number of observations","Nominal (categorical) variables","Variables that are completely uncorrelated"],"a":[0,1,2],"e":"PCA needs quantitative, correlated variables and a large sample. Uncorrelated variables cannot be combined."},{"c":"PCA","t":"match","q":"Match each description with the right term.","m":["Share of a variable’s variance shared with the other variables","Amount of variance a component explains","Plot used for the Cattell criterion","Orthogonal rotation that maximises loadings within components"],"o":["Communality","Eigenvalue","Scree plot","Varimax","KMO"],"a":[0,1,2,3],"e":"Communality, eigenvalue, scree plot and varimax. KMO is an initial check, not any of these."},{"c":"PCA","t":"multi","q":"Which are statistical criteria for deciding how many components to extract?","o":["Cumulative variance explained (often at least 60%)","Kaiser criterion (eigenvalue above 1)","Scree plot (Cattell)","Cronbach’s alpha","Bartlett’s test"],"a":[0,1,2],"e":"B1, B2 and B3. Alpha is for reliability and Bartlett’s test is an initial check."},{"c":"Reliability","t":"mc","q":"An item has a corrected item-total correlation of .15 in a scale. What should you consider?","o":["Dropping the item","Reversing the scale","Adding more respondents","Rotating obliquely"],"a":0,"e":"Values below about .3 mean the item does not fit the scale, so it may need to be dropped."}],hw:[]},
{n:2,title:"Conceptual models & one-way ANOVA",chapters:"Field ch. 12 · Lectures 2a, 2b",
summary:[{h:"Models and variables",p:["OV (outcome) = DV; PV (predictor) = IV. A moderator changes the strength or direction of the PV–OV relationship; a mediator sits on the path “via” which the effect goes.","The p-value is the probability of a result at least this extreme if H0 is true."]},
{h:"Knowledge clips: models, hypotheses, assumptions",p:["Order of work: research question → conceptual model → hypotheses. Hypotheses are written before collecting data, based on theory. Not every possible arrow needs a hypothesis. The statistical model estimates everything, including effects you are not conceptually interested in.","In a conceptual model, boxes are variables, arrows are relationships from PV to OV, and hypotheses refer to arrows. A + on a moderator arrow means the effect is strengthened.","ANOVA applies when the OV is quantitative, the PV is categorical with more than 2 categories, and groups are independent. With 2 categories use the independent samples t-test. Assumptions: homogeneous variance, normal residuals, roughly equal group sizes. SPSS will run ANOVA anyway, but results are invalid if assumptions fail.","H0: μ₁ = μ₂ = … = μᵢ; H1: at least one μ differs. H0 is rejected if F is larger than the critical value. 1 PV = one-way ANOVA; more PVs = n-way/factorial ANOVA."]},
{h:"Sums of squares: worked example (cuteness, 10 animals, 3 groups)",p:["Grand mean 32.3. SST = 1192.10 = SSM 1140.68 + SSR 51.42. R² = 1140.68 / 1192.10 = 95.7%.","dfM = k − 1 = 2, dfR = n − k = 7. MSM = 570.34, MSR = 7.35, F = 77.60. Critical F(2,7) = 4.74, so H0 is rejected: at least two group means differ."]},
{h:"SPSS example (alcohol and attractiveness)",p:["Between groups SS 3598.067, df 2, MS 1799.033; within 18696.925, df 117, MS 159.803; F = 11.258, p < .001. R² = 3598.07 / 22294.99 = 16.1%.","ANOVA is an omnibus test, so follow up. Planned contrasts need prior hypotheses; weights sum to 0 and the contrasts should be orthogonal. Post hoc tests (e.g. Bonferroni: α divided by the number of comparisons) are for exploring. Levene’s test checks equal variances; if violated use Welch or Brown-Forsythe."]},
{h:"Alternatives and effect size",p:["Within-subjects design → repeated-measures ANOVA. Unequal variances → Welch. Non-normal data → Kruskal-Wallis (not covered).","Effect size η² = SSM/SST; ω² = (SSM − dfM·MSR)/(SST + MSR); r(contrast) = √(t²/(t²+df))."]}],
formulas:[{t:"Total SS",f:"SST = Σ(xᵢ − x̄grand)²",g:0},{t:"Model SS",f:"SSM = Σ nₖ(x̄ₖ − x̄grand)²",g:0},{t:"Residual SS",f:"SSR = Σ s²ₖ(nₖ − 1)",g:0},{t:"Degrees of freedom",f:"dfM = k − 1; dfR = N − k",g:0},{t:"F-ratio",f:"F = MSM / MSR, MS = SS/df",g:0},{t:"R² / η²",f:"SSM / SST",g:0},{t:"Omega squared",f:"ω² = (SSM − dfM·MSR)/(SST + MSR)",g:0},{t:"Contrast effect size",f:"r = √(t² / (t² + df))",g:0}],
terms:[["ANOVA","Compares more than two means via between-group versus within-group variability."],["Omnibus test","Says whether any difference exists, not where."],["Planned contrast","Hypothesis-driven comparison; weights sum to 0."],["Post hoc test","Compares all pairs with correction for error inflation."],["Bonferroni","Divides α by the number of comparisons."],["Levene’s test","Tests equal variances."],["Welch’s F","ANOVA robust to unequal variances."],["Moderator","Variable that changes the effect of a PV on the OV."],["Mediator","Variable through which a PV affects the OV."],["Hypothesis","Unambiguous verbal expression of an expected relationship (an arrow in the model)."],["Statistical model","Estimates everything, not only the effects you are conceptually interested in."]],
q:[{c:"ANOVA",t:"num",q:"SSM = 1140.68 and SST = 1192.10. What is R² as a percentage?",a:95.7,tol:0.2,u:"%",e:"1140.68 / 1192.10 = .957."},
{c:"ANOVA",t:"num",q:"SSR = 51.42 with n = 10 and k = 3. What is MSR?",a:7.35,tol:0.02,u:"",e:"dfR = 7, so 51.42 / 7 = 7.35."},
{c:"ANOVA",t:"mc",q:"What must be true of the weights in a planned contrast?",o:["They sum to 0","They sum to 1","All are positive","All are equal"],a:0,e:"Contrast weights must sum to zero."},{"c":"Models","t":"multi","q":"When can you use a one-way independent ANOVA?","o":["The outcome is quantitative","One categorical predictor with more than 2 categories","Independent (different) participants per group","The same participants are measured in every group","Two quantitative predictors"],"a":[0,1,2],"e":"Quantitative OV, one categorical PV with 3+ groups, independent groups. Repeated measures need a different ANOVA."},{"c":"Models","t":"match","q":"Match each description with the right term.","m":["The effect goes “via” another variable","Changes the strength of the PV–OV relationship","Hypothesis-driven comparison with weights summing to 0","Compares all pairs with a correction"],"o":["Mediator","Moderator","Planned contrast","Post hoc test","Omnibus test"],"a":[0,1,2,3],"e":"Mediator, moderator, planned contrast, post hoc test. The omnibus test is the overall F-test."}],
quiz:[{c:"ANOVA",t:"num",q:"10 observations in 3 groups. What is dfR?",a:7,tol:0,u:"",e:"n − k = 10 − 3."},
{c:"ANOVA",t:"num",q:"MSM = 570.34 and MSR = 7.35. What is F?",a:77.6,tol:0.3,u:"",e:"570.34 / 7.35 ≈ 77.6."},
{c:"Follow-up",t:"num",q:"Three groups, all pairwise comparisons, Bonferroni at α = .05. What is the per-test α?",a:0.0167,tol:0.0005,u:"",e:"3 comparisons: .05 / 3 = .0167."},
{c:"Follow-up",t:"mc",q:"Contrast 1 weights (−1, .5, .5) and contrast 2 weights (0, −1, 1). Orthogonal?",o:["Yes: the products sum to 0","No: the first sums to 0","No: weights differ in size","Cannot be determined"],a:0,e:"(−1·0) + (.5·−1) + (.5·1) = 0."},{"c":"ANOVA","t":"num","q":"Between groups SS = 20.133 (df 2), within groups SS = 23.600 (df 12). What is F?","a":5.12,"tol":0.03,"u":"","e":"MSM = 10.067, MSR = 23.600 / 12 = 1.967, F = 5.12."},{"c":"ANOVA","t":"num","q":"Using the same table, what is η² (3 decimals)? Total SS = 43.733.","a":0.46,"tol":0.002,"u":"","e":"20.133 / 43.733 = .460."},{"c":"Models","t":"multi","q":"Which are assumptions of the one-way independent ANOVA?","o":["Variance is homogeneous across groups","Residuals are normally distributed","Groups are roughly equal in size","Predictor is quantitative","Participants appear in every group"],"a":[0,1,2],"e":"Homogeneity, normal residuals and roughly equal group sizes. The PV is categorical and groups are independent."},{"c":"ANOVA","t":"mc","q":"F = 77.60 and the critical value for F(2,7) is 4.74. What is the conclusion?","o":["Reject H0: at least two means differ","Retain H0","Reject H0: all means differ","Cannot be decided without p"],"a":0,"e":"F is above the critical value, so H0 is rejected. This only says at least one difference exists."}],hw:[]},
{n:3,title:"Interaction & factorial ANOVA",chapters:"Field ch. 11.3 and 14 · Lecture 3a",
summary:[{h:"Moderation",p:["Moderation (interaction): the effect of one PV on the OV depends on the level of another PV. In regression the interaction term is the product of the two variables; predictors are grand-mean centred first. Significant interaction → simple slopes at mean − 1 SD, mean, mean + 1 SD.","In graphs, parallel lines suggest no interaction; non-parallel lines suggest one (crossing is not required). Always test before interpreting."]},
{h:"Factorial ANOVA",p:["Quantitative OV, two or more categorical PVs, independent groups. SSM splits into SSA, SSB and SSA×B (= SSM − SSA − SSB). df for a factor = levels − 1; df interaction = (a − 1)(b − 1). F = MS effect / MS error.","Alcohol × gender example, 3 × 2 design, N = 120: corrected model SS 6031.942 (df 5, F = 8.456, R² = .271); gender SS 95.408 (df 1, F = 0.669, p = .415); alcohol SS 3598.067 (df 2, F = 12.611); interaction SS 2338.467 (df 2, F = 8.196, p < .001); error SS 16263.050, df 114, MS 142.658."]},
{h:"Follow-up and effect size",p:["With a significant interaction, interpret main effects with care. Use plots and simple effects tests (syntax or the EM Means option).","Partial η² = SSeffect / (SSeffect + SSerror): .01–.06 small, .06–.14 medium, above .14 large. Example: gender .006, alcohol .181, interaction .126."]}],
formulas:[{t:"Interaction SS",f:"SSA×B = SSM − SSA − SSB",g:0},{t:"Interaction df",f:"dfA×B = (a − 1)(b − 1)",g:0},{t:"Factor F",f:"F = MSeffect / MSerror",g:0},{t:"Partial eta squared",f:"SSeffect / (SSeffect + SSerror)",g:0},{t:"Interaction term",f:"interaction = variable 1 × variable 2",g:0}],
terms:[["Interaction","Effect of one PV depends on another PV."],["Grand mean centring","Subtracting the overall mean from each score."],["Simple slopes","Effect of the predictor at low, mean and high moderator values."],["Factorial ANOVA","ANOVA with more than one categorical predictor."],["Simple effects test","Compares levels of one factor within each level of the other."],["Partial η²","Effect size per effect: SSeffect / (SSeffect + SSerror)."],["3 × 2 design","Two factors with 3 and 2 levels, 6 conditions."]],
q:[{c:"Factorial",t:"num",q:"What are the df of the interaction in a 3 × 2 design?",a:2,tol:0,u:"",e:"(3 − 1)(2 − 1) = 2."},
{c:"Factorial",t:"num",q:"Gender SS = 95.408, error SS = 16263.050. What is partial η² (3 decimals)?",a:0.006,tol:0.001,u:"",e:"95.408 / 16358.458 = .0058."},
{c:"Factorial",t:"mc",q:"Two perfectly parallel lines in an interaction plot suggest…",o:["No interaction","A strong interaction","A significant main effect of both","A violated assumption"],a:0,e:"Parallel lines mean the effect is the same at every level."},{"c":"Interaction","t":"multi","q":"Which statements about interaction are true?","o":["The effect of one PV depends on the level of another PV","Non-parallel lines suggest an interaction","Moderation and main effects are independent of each other","A significant interaction always means the lines cross"],"a":[0,1,2],"e":"Crossing is only one type of interaction (a difference in direction). A difference in magnitude also counts, and you should test it."},{"c":"Factorial","t":"match","q":"Match each description with the right term.","m":["Effect size per effect, SSeffect / (SSeffect + SSerror)","Compares levels of one factor within each level of the other","SPSS row for the significance of the whole model","Graph used to inspect the pattern of an interaction"],"o":["Partial η²","Simple effects test","Corrected model","Interaction plot","Levene’s test"],"a":[0,1,2,3],"e":"Levene’s test checks equal variances, so it is the distractor."}],
quiz:[{c:"Factorial",t:"num",q:"N = 120. What are the total df?",a:119,tol:0,u:"",e:"N − 1."},

{c:"Factorial",t:"num",q:"SSM = 6031.942, SSA = 95.408, SSB = 3598.067. What is SSA×B?",a:2338.467,tol:0.05,u:"",e:"6031.942 − 95.408 − 3598.067 = 2338.467."},
